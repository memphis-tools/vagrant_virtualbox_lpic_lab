# =======================
# ACCESS CONTROL LISTS
# =======================

# Local network access
acl local_lan src 192.168.1.0/24

# Time access
acl work_hours time MTWHFSA 08:00-18:00

# Port ACLs
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 21
acl Safe_ports port 443

# Allow fetching of intermediate CA certificates
acl intermediate_fetching transaction_initiator certificate-fetching

# SSL bump ACL for apt
# These are domain part from the SNI (Server Name Indication) in the SSL handshake
acl step1 at_step SslBump1
acl debian_repos ssl::server_name \
    .debian.org \
    .debian.net \
    security.debian.org

# Proxy Authentication
# Define the LDAP authentication helper
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/vault/clients_password
auth_param basic children 5
auth_param basic realm Squid Homelab
auth_param basic credentialsttl 1 minute
auth_param basic casesensitive on

# Define the realm (this will show up on the authentication prompt)
auth_param basic realm Squid-Proxy-Ldap-Authentication

# Set the authentication method to basic (can also use digest, but basic is common)
auth_param basic children 5
auth_param basic credentialsttl 1 minute
auth_param basic casesensitive off

acl ldap_users proxy_auth REQUIRED

client_lifetime 1 hour
request_timeout 1 hour
read_timeout 1 hour

# =======================
# HTTP ACCESS RULES
# =======================

# Allow intermediate cert fetching
http_access allow intermediate_fetching

# Deny unsafe ports
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Allow authenticated users
#http_access allow ldap_users local_lan work_hours

acl CONNECT method CONNECT
http_access allow CONNECT ldap_users local_lan work_hours

# Allow access to localhost and manager interface
http_access allow localhost manager
http_access deny manager
http_access allow localhost
http_access allow ldap_users

# Final deny rule (default deny all)
http_access deny all

# =======================
# NETWORK SETTINGS
# =======================

# SSL Bump with SSL inspection and dynamic certs
http_port 3128 ssl-bump \
    generate-host-certificates=on \
    dynamic_cert_mem_cache_size=32MB \
    tls-cert=/etc/squid/ssl_cert/vagrant_squid_mitm_ca.crt \
    tls-key=/etc/squid/ssl_cert/vagrant_squid_mitm_ca.key \
    cipher=HIGH:MEDIUM:!LOW:!RC4:!SEED:!IDEA:!3DES:!MD5:!EXP:!PSK:!DSS \
    options=NO_TLSv1,NO_SSLv3 \
    tls-dh=/etc/squid/squid.dhparam.pem \
    tcpkeepalive=60,30,3

# =======================
# SSL BUMP CONFIGURATION (ORDER MATTERS)
# =======================
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 32MB

# peek action is used to inspect the initial handshake and extract certain information from the SSL/TLS session (like the SNI (Server Name Indication)
ssl_bump peek step1
# splice action is used to bypass interception for certain connections, meaning Squid will not decrypt or modify the traffic
ssl_bump splice debian_repos
# for all other traffic, Squid will inspect the connection but without decrypting the content, mainly based on SNI or other SSL parameters.
ssl_bump stare all

sslproxy_cert_error deny all

# =======================
# CACHE SETTINGS
# =======================
# cache_dir ufs /var/spool/squid 100 16 256
# 100 MB is very small for a cache directory, especially if you have multiple clients or frequently accessed content.
# 16 first-level subdirectories and 256 second-level are standard and fine.
cache_dir ufs /var/spool/squid 256 16 256
coredump_dir /var/spool/squid

# =======================
# REFRESH PATTERNS
# =======================
refresh_pattern ^ftp:           1440    20%    10080
refresh_pattern -i (/cgi-bin/|\?) 0     0%     0
refresh_pattern .               0       20%    4320

# =======================
# LOGGING / DEBUGGING
# =======================
debug_options ALL,1 5,2 33,2

# 11,2 is useful here because Squid can dump the HTTP request it sees; Squid maintainers specifically recommend it for inspecting HTTP transactions after SSL-Bump.
# debug_options ALL,1 5,2 11,2 33,2
