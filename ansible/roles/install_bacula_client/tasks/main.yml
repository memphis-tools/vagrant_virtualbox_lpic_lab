---
- name: Setup on Debian
  ansible.builtin.include_tasks:
    file: setup_on_debian.yml
    apply:
      tags:
        - install
  tags:
    - install
  when: ansible_distribution == 'Debian'

- name: Setup on Rhel
  ansible.builtin.include_tasks:
    file: setup_on_rhel.yml
    apply:
      tags:
        - install
  tags:
    - install
  when: ansible_distribution == 'Rocky'
