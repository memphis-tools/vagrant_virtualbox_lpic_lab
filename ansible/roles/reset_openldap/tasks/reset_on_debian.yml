---
- name: Enable ldapi
  ansible.builtin.lineinfile:
    path: /etc/default/slapd
    regex: '^SLAPD_SERVICES'
    line: 'SLAPD_SERVICES="ldapi:/// ldap:/// ldaps:///"'
    mode: '0644'

- name: Restart slapd
  ansible.builtin.service:
    name: slapd
    state: restarted

# - name: Configure OpenLDAP database
