---
- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Install sssd
  ansible.builtin.apt:
    name: sssd
    state: present

- block:
  - name: Uninstall nslcd if installed
    ansible.builtin.apt:
      name: nslcd
      state: absent
      purge: yes

  - name: Stop nscd
    ansible.builtin.service:
      name: nscd
      state: stopped

  - name: Disable nscd
    ansible.builtin.service:
      name: nscd
      enabled: no
  when: '"nslcd" in ansible_facts.packages'

- name: Template sssd configuration
  ansible.builtin.template:
    src: 'sssd.conf.j2'
    dest: '/etc/sssd/sssd.conf'
    owner: 'root'
    group: 'root'
    mode: '0600'
  no_log: yes

- name: Copy nsswitch configuration
  ansible.builtin.copy:
    src: 'files/nsswitch.conf'
    dest: '/etc/nsswitch.conf'
    mode: '0644'

- name: Enable automatic home directory creation via pam_mkhomedir
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-session
    line: 'session required pam_mkhomedir.so skel=/etc/skel/ umask=0077'
    state: present

- name: Restart sssd
  ansible.builtin.service:
    name: sssd
    state: restarted
