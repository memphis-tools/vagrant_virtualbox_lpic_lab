---
- name: Ensure nslcd package is installed
  ansible.builtin.apt:
    name: '{{ item }}'
    state: present
  loop:
    - nslcd
    - libsasl2-modules

- name: Template nslcd configuration
  ansible.builtin.template:
    src: 'nslcd.conf.j2'
    dest: '/etc/nslcd.conf'
    owner: 'nslcd'
    group: 'nslcd'
    mode: '0600'

- name: Ensure the /etc/ssl/localcerts/ exists
  ansible.builtin.file:
    path: '/etc/ssl/localcerts/'
    state: directory
    mode: '0755'

- name: Copy nslcd-client certificate
  ansible.builtin.copy:
    src: 'files/vagrant_nslcd-client.crt'
    dest: '/etc/ssl/localcerts/vagrant_nslcd-client.crt'
    owner: 'nslcd'
    group: 'nslcd'
    mode: '0644'

- name: Copy nslcd-client key
  ansible.builtin.copy:
    src: 'files/vagrant_nslcd-client.key'
    dest: '/etc/ssl/localcerts/vagrant_nslcd-client.key'
    owner: 'nslcd'
    group: 'nslcd'
    mode: '0600'

- name: Copy nsswitch configuration file
  ansible.builtin.copy:
    src: 'files/nsswitch.conf'
    dest: '/etc/nsswitch.conf'
    mode: '0644'

- name: Ensure /etc/ldap folder exists
  ansible.builtin.file:
    path: '/etc/ldap'
    state: directory
    mode: 0755

- name: Copy ldap.conf configuration file
  ansible.builtin.copy:
    src: 'files/ldap.conf'
    dest: '/etc/ldap/ldap.conf'
    mode: '0644'

- name: Enable automatic home directory creation via pam_mkhomedir
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-session
    line: "session required pam_mkhomedir.so skel=/etc/skel/ umask=0077"
    state: present

- name: Restart nslcd
  ansible.builtin.service:
    name: nslcd
    state: restarted
