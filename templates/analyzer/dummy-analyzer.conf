<VirtualHost *:80>
   ServerName analyzer.vagrant-dummy-ops.lab
   ServerAlias analyzer.vagrant.lab
   Redirect permanent / https://analyzer.vagrant-dummy-ops.lab
</VirtualHost>

<VirtualHost *:443>
  ServerName analyzer.vagrant-dummy-ops.lab
  ServerAlias analyzer.vagrant.lab
   SSLEngine on
   SSLCertificateFile /etc/ssl/localcerts/vagrant_analyzer.crt
   SSLCertificateKeyFile /etc/ssl/localcerts/vagrant_analyzer.key
   ServerAdmin shijuro@dovecot.vagrant-dummy-ops.lab

   DocumentRoot /var/www/html/
   DirectoryIndex index.php index.html

   <Directory /var/www/html/>
       AuthType Basic
       AuthName "PROTECTED ANALYZER AREA"
       AuthUserFile /etc/apache2/.htpasswd
       Require valid-user
       ErrorDocument 401 /login-error.html
    </Directory>

   # --- PHP-FPM configuration ---
   <FilesMatch \.php$>
       SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost/"
   </FilesMatch>

   ErrorLog ${APACHE_LOG_DIR}/analyzer.vagrant-dummy-ops.lab-error.log
   CustomLog ${APACHE_LOG_DIR}/analyzer.vagrant-dummy-ops.lab-access.log combined
</VirtualHost>
