<VirtualHost *:80>
   ServerName apache.vagrant-dummy-ops.lab
   ServerAlias apache.vagrant.lab
   Redirect permanent / https://apache.vagrant-dummy-ops.lab
</VirtualHost>

<VirtualHost *:443>
  ServerName apache.vagrant-dummy-ops.lab
  ServerAlias apache.vagrant.lab
   SSLEngine on
   SSLCertificateFile /etc/ssl/localcerts/vagrant_apache.crt
   SSLCertificateKeyFile /etc/ssl/localcerts/vagrant_apache.key
   ServerAdmin shijuro@dovecot.vagrant-dummy-ops.lab

   DocumentRoot /var/www/html/
   DirectoryIndex index.php index.html

   <Directory /var/www/html/>
       AuthType Basic
       AuthName "PROTECTED APACHE AREA"
       AuthUserFile /etc/apache2/.htpasswd
       Require valid-user
       ErrorDocument 401 /login-error.html
    </Directory>

   # --- PHP-FPM configuration ---
   <FilesMatch \.php$>
       SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost/"
   </FilesMatch>

   ErrorLog ${APACHE_LOG_DIR}/apache.vagrant-dummy-ops.lab-error.log
   CustomLog ${APACHE_LOG_DIR}/apache.vagrant-dummy-ops.lab-access.log combined
</VirtualHost>
